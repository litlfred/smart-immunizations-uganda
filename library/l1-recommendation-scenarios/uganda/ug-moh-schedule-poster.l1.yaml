  - {key: P03, page: "1", from: T-10W, statement: "10 Weeks (2.5 months): Whooping cough, Haemophilus influenza type B, Rotavirus Diarrhoea, Polio, Tetanus, Hepatitis B, Meningitis, Pneumonia, Diphtheria", population: [P-UG-INFANTS], recommends: [HI-UG-CHILD-ROUTINE]}
  - {key: P04, page: "1", from: T-14W, statement: "14 Weeks (3.5 months): Polio, Whooping cough, Haemophilus influenza type B, Rotavirus Diarrhoea, Tetanus, Hepatitis B, Meningitis, Pneumonia, Diphtheria", population: [P-UG-INFANTS], recommends: [HI-UG-CHILD-ROUTINE]}
  - {key: P05, page: "1", from: T-6M, statement: "6 Months: Malaria, Vitamin A", population: [P-UG-INFANTS], recommends: [HI-UG-MALARIA, HI-UG-VITA]}
  - {key: P06, page: "1", from: T-7M, statement: "7 Months: Malaria", population: [P-UG-INFANTS], recommends: [HI-UG-MALARIA]}
  - {key: P07, page: "1", from: T-8M, statement: "8 Months: Malaria", population: [P-UG-INFANTS], recommends: [HI-UG-MALARIA]}
  - {key: P08, page: "1", from: T-9M, statement: "9 Months: Measles, Rubella, Yellow Fever", population: [P-UG-INFANTS], recommends: [HI-UG-CHILD-ROUTINE]}
  - {key: P09, page: "1", from: T-18M, statement: "18 Months: Measles, Rubella, Malaria, Vitamin A", population: [P-UG-INFANTS], recommends: [HI-UG-CHILD-ROUTINE, HI-UG-MALARIA, HI-UG-VITA]}
  - {key: P10, page: "1", from: T-10Y, statement: "10yr Girl: 1 dose HPV vaccine to prevent cancer of the cervix", population: [P-UG-GIRLS-10], recommends: [HI-UG-HPV]}
  - {key: P11, page: "1", from: T-WCBA, statement: "1st Dose At first contact Tetanus Diphtheria", population: [P-UG-WCBA], recommends: [HI-UG-TD-WCBA]}
