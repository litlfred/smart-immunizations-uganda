name: Checks

# Every check runs the upstream toolchain in place, pinned by commit, never a copy
# (smart-base `smart-base-tools`, "Adapting a DAK"):
#   SMART_BASE_REF  litlfred/smart-base: the Tool l1-transcription-verbatim
#   IMMZ_REF        litlfred/smart-immunizations: tools/node (processDTSchedule.js, makeExample.js)
# The full IG build, which compiles the CQL, is the WHO path: fhirbuild.yml (HL7 auto-build).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SMART_BASE_REF: f6f42cc4c6de901b0f4b8c7a84fb571bc258b534
  IMMZ_REF: a48d95affed69af8147f51b31753702f2ccb74cd

jobs:
  # Which checks a pull request's change can affect. A job whose inputs the PR does not
  # touch is skipped, and a skipped job reports success to a required check. Pushes to main
  # and manual runs run everything. The paths are each job's inputs, read from its steps;
  # this workflow file and package.json count for every job.
  changes:
    runs-on: ubuntu-latest
    outputs:
      l1: ${{ steps.f.outputs.l1 }}
      logic: ${{ steps.f.outputs.logic }}
      sushi: ${{ steps.f.outputs.sushi }}
      l1pages: ${{ steps.f.outputs.l1pages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: f
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            for k in l1 logic sushi l1pages; do echo "$k=true" >> "$GITHUB_OUTPUT"; done; exit 0
          fi
          files=$(git diff --name-only "$(git merge-base "$BASE" "$HEAD")" "$HEAD")
          printf '%s\n' "$files"
          hit() { printf '%s\n' "$files" | grep -qE "$1" && echo true || echo false; }
          all='^(\.github/workflows/checks\.yml|package\.json)$'
          echo "l1=$(hit "$all|^library/")" >> "$GITHUB_OUTPUT"
          echo "logic=$(hit "$all|^input/(decision-logic|cql|tests|l2|fsh/libraries|fsh/plandefinitions)/|^library/|^scripts/")" >> "$GITHUB_OUTPUT"
          echo "l1pages=$(hit "$all|^library/|^input/l1-pages/|^input/pagecontent/(l1-recommendations|scenario-candidates)\.md$|^index\.(config|lock)\.json$")" >> "$GITHUB_OUTPUT"
          echo "sushi=$(hit "$all|^input/|^sushi-config\.yaml$")" >> "$GITHUB_OUTPUT"

  l1:
    needs: changes
    if: needs.changes.outputs.l1 == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: litlfred/smart-base
          ref: ${{ env.SMART_BASE_REF }}
          path: .upstream/smart-base
          sparse-checkout: smart-base/scripts
      - uses: oven-sh/setup-bun@v2
      - name: Install the Tool's one dependency
        # smart-base has no root package.json, so give the checkout its own; without one bun
        # walks up to this repository's, whose workspaces are the absent platform mounts.
        working-directory: .upstream/smart-base
        run: echo '{"private":true}' > package.json && bun add yaml@2.4.5
      - name: Authored L1 is verbatim in its library entries (smart-base l1-transcription-verbatim)
        # Run from the smart-base checkout: this repository's package.json names the mounted
        # platform layers as workspaces, which a CI checkout does not have.
        working-directory: .upstream/smart-base
        run: bun smart-base/scripts/l1-transcription-verbatim.ts --root "$GITHUB_WORKSPACE" --dir library/l1-recommendation-scenarios/uganda

  logic:
    needs: changes
    if: needs.changes.outputs.logic == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: litlfred/smart-immunizations
          ref: ${{ env.IMMZ_REF }}
          path: .upstream/smart-immunizations
          sparse-checkout: tools/node
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install WHO's DAK converters
        # makeExample.js requires `yaml`, which tools/node/package.json does not list (an
        # upstream gap, reported on smart-immunizations-uganda#3); installed beside the pinned set.
        working-directory: .upstream/smart-immunizations/tools/node
        run: npm ci && npm install --no-save yaml@2.4.5
      - name: The schedule FSH is the converter's output of the Uganda workbook
        run: |
          IMMZ_HOME=$PWD/.upstream/smart-immunizations npm run --silent logic:generate
          git diff --exit-code -- input/fsh/libraries input/fsh/plandefinitions
      - name: Every test file builds into FHIR test bundles (makeExample.js)
        run: IMMZ_HOME=$PWD/.upstream/smart-immunizations npm run --silent logic:examples
      - name: The hand-completed CQL gives the workbook's due dates and messages
        # The FSH is checked above; the CQL is completed by hand from the skeletons'
        # pseudocode, and nothing compared the two (folio-assistant#215 walk).
        run: IMMZ_HOME=$PWD/.upstream/smart-immunizations npm run --silent logic:check-cql
      - name: Every adapted table's ages and intervals are in the L1 evidence it cites
        run: npm run --silent l2:evidence

  # The two L1 pages are written by the shared generator of the pinned layers
  # (smart-base l1-statement-lists, folio-assistant-core statements:pages), so this job
  # mounts what index.lock.json pins, as site-publish.yml does, and checks both are current.
  l1-pages:
    needs: changes
    if: needs.changes.outputs.l1pages == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14  # the platform's CI version, as site-publish.yml
      - name: Mount the layers index.lock.json pins
        run: |
          ref=$(python3 -c "import json;print(next(m['ref'] for m in json.load(open('index.lock.json'))['mounts'] if m['harness']=='cat-harness-tools'))")
          M="$RUNNER_TEMP/mounter"
          git init -q "$M"
          git -C "$M" fetch -q --depth 1 https://github.com/litlfred/cat-harness-tools.git "$ref"
          git -C "$M" checkout -q FETCH_HEAD
          bun run "$M/scripts/mount-from-lock.ts" --root .
          for d in $(python3 -c "import json;print(' '.join(sorted({i['path'] for i in json.load(open('index.lock.json'))['instances']})))"); do
            [ -f "$d/package.json" ] && (cd "$d" && bun install --no-save)
          done
      - name: The statement lists and the L1 Recommendations and Scenario Candidates pages are current
        run: bun run l1:pages:check

  sushi:
    needs: changes
    if: needs.changes.outputs.sushi == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile FSH with SUSHI
        run: npx --yes fsh-sushi@3.21.0 build .
